name: Update TD Board

on:
  schedule:
    - cron: "0 12 * * 2"   # Tue 12:00 UTC - full model rebuild once the week's games are final
    - cron: "0 15 * * 3"   # Wed 11am ET - prices for Wednesday night openers
    - cron: "0 15 * * 4"   # Thu 11am ET - prices for Thursday night games
    - cron: "0 13 * * 0"   # Sun  9am ET - prices before the main slate
  workflow_dispatch:        # run any time from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install pandas numpy

      # Full rebuild only on Tuesday and on manual runs. The other schedules just
      # refresh prices, so the stats stay exactly as they were graded on Tuesday.
      # A rebuild carries existing prices forward, so the Bets tab is never blank.
      - name: Rebuild model
        if: github.event.schedule == '0 12 * * 2' || github.event_name == 'workflow_dispatch'
        run: python update.py 2026        # change the season once a year

      # Needs the ODDS_API_KEY repository secret. Without it this step does
      # nothing and the board keeps whatever prices were last pasted in.
      - name: Refresh odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds.py

      - name: Commit
        run: |
          git config user.name  "td-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "refresh: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing changed"
          git push
