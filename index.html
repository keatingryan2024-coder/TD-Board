<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TD Board</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{
  --paper:#F5F6F8; --card:#FFFFFF; --sunk:#FAFBFC;
  --ink:#12161C; --ink2:#6B7280; --ink3:#9CA3AF;
  --line:#E7E9EE; --line2:#F0F1F4;
  --pos:#1B7F5A; --neg:#B4402F;
  --ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --num:'IBM Plex Mono',ui-monospace,monospace;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 100px}

/* masthead — one line, nothing fights for attention */
.mast{border-bottom:1px solid var(--line);margin:0 -20px 0;padding:0 20px;background:var(--card)}
.mast-in{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;
  max-width:940px;margin:0 auto;padding:22px 0}
.wordmark{font-size:19px;font-weight:600;letter-spacing:-.01em}
.wordmark b{font-weight:400;color:var(--ink3)}
.meta{font-family:var(--num);font-size:11.5px;color:var(--ink3)}
.meta b{color:var(--ink2);font-weight:500}

/* tabs */
.tabs{display:flex;gap:4px;margin:20px 0 20px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:none;padding:9px 4px;margin-right:22px;font-family:var(--ui);
  font-size:13.5px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.view{display:none}.view.on{display:block}

/* one control row */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{appearance:none;background:none;border:none;border-right:1px solid var(--line);
  padding:6px 12px;font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.grow{flex:1}
.link{appearance:none;background:none;border:none;font-family:var(--ui);font-size:12.5px;color:var(--ink3);
  cursor:pointer;padding:4px 0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{color:var(--ink)}
.find{font-family:var(--ui);font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);color:var(--ink);width:150px}
.find::placeholder{color:var(--ink3)}
.find:focus{outline:none;border-color:var(--ink)}

/* adjust panel — closed by default, one line of sliders */
.adjust{display:none;gap:20px;padding:14px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:14px;flex-wrap:wrap}
.adjust.on{display:flex}
.adj{flex:1;min-width:150px}
.adjtop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:7px}
.adjtop b{color:var(--ink);font-weight:500;font-family:var(--num)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--ink);cursor:pointer;border:none}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);cursor:pointer;border:none}

/* the list — the one thing that should dominate the page */
.board{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.row:first-child{padding-top:2px}
.row:hover .nm{color:var(--tc,var(--ink))}
.rk{font-family:var(--num);font-size:12px;color:var(--ink3);width:16px;flex:none;text-align:right}
.crest{width:24px;height:24px;object-fit:contain;flex:none}
.who{flex:1;min-width:0}
.nm{font-size:15px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-family:var(--num);font-size:11.5px;color:var(--ink3);margin-top:2px}
.sub b{color:var(--ink2);font-weight:500}
.flag{font-family:var(--ui);font-size:11px;color:var(--ink3);margin-left:6px}
.flag.warn{color:var(--neg)}
.pv{font-family:var(--num);font-size:20px;font-weight:500;letter-spacing:-.02em;color:var(--tc,var(--ink));
  width:52px;text-align:right;flex:none}
.priceCell{width:112px;flex:none;text-align:right}
.odds{width:100%;font-family:var(--num);font-size:12px;text-align:right;padding:5px 8px;border:1px solid var(--line);
  border-radius:5px;background:var(--card);color:var(--ink)}
.odds::placeholder{color:var(--ink3);font-family:var(--ui)}
.odds:focus{outline:none;border-color:var(--ink)}
.odds.p{border-color:var(--pos)}.odds.n{border-color:var(--neg)}
.edge{display:block;margin-top:3px;font-family:var(--num);font-size:10.5px;text-align:right;color:var(--ink3)}
.edge.p{color:var(--pos)}.edge.n{color:var(--neg)}
.row.dim{opacity:.4}

/* detail — everything secondary lives here, only on click */
.det{display:none;padding:14px 0 8px 40px;margin-top:-2px}
.row.open+.det{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:30px;border-bottom:1px solid var(--line2)}
.dk{font-size:10.5px;color:var(--ink3);margin-bottom:9px;line-height:1.5}
.log{display:flex;flex-wrap:wrap;gap:3px}
.g{width:18px;height:18px;border-radius:3px;background:var(--line2);font-family:var(--num);font-size:8.5px;
  display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.g.hit{background:var(--tc,var(--ink));color:#fff}
.brk{display:grid;grid-template-columns:70px 1fr 40px;gap:9px;align-items:center;margin-bottom:6px;font-size:11px;color:var(--ink2)}
.brk .t{height:3px;background:var(--line2)}
.brk .t i{display:block;height:100%;background:var(--tc,var(--ink))}
.brk .v{font-family:var(--num);font-size:11px;text-align:right;color:var(--ink)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:var(--num);font-size:10px;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:2px 6px}

/* slate */
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gm{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gmh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 13px;
  border-bottom:1px solid var(--line);background:var(--sunk)}
.gmt{font-size:13.5px;font-weight:600}
.gmt em{font-style:normal;color:var(--ink3);font-weight:400;margin:0 3px}
.gml{font-family:var(--num);font-size:10.5px;color:var(--ink3)}
.gmb{display:grid;grid-template-columns:1fr 1fr}
.sd{padding:10px 13px}
.sd+.sd{border-left:1px solid var(--line2)}
.sdh{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.sdh img{width:15px;height:15px;object-fit:contain}
.sdh span{font-size:12px;font-weight:600;color:var(--tc,var(--ink))}
.pr{display:flex;justify-content:space-between;gap:6px;padding:2px 0;font-size:11.5px}
.pr span:first-child{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr span:last-child{font-family:var(--num);color:var(--ink)}

/* tables */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--sunk);font-size:10px;font-weight:500;color:var(--ink3);text-align:right;
  padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th:hover{color:var(--ink)}
th.on{color:var(--ink);font-weight:600}
td{font-family:var(--num);font-size:12px;padding:9px 13px;border-bottom:1px solid var(--line2);color:var(--ink2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--sunk)}
.tc{display:flex;align-items:center;gap:8px}
.tc img{width:16px;height:16px;object-fit:contain}
.tc span{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--ink)}
td.max{color:var(--ink);font-weight:500}
td.up{color:var(--pos)}td.down{color:var(--neg)}
.betname{font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--ink)}
.betsub{font-family:var(--ui);font-size:10.5px;color:var(--ink3);margin-top:1px}

.primary{appearance:none;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;
  padding:6px 13px;font-family:var(--ui);font-size:12.5px;font-weight:500;cursor:pointer}
.primary:hover{opacity:.85}
.foot{margin-top:26px;padding:16px 0 0;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--ink3)}
.foot b{color:var(--ink2);font-weight:500}
.foot p{margin:0 0 8px;max-width:70ch}.foot p:last-child{margin:0}
.empty{padding:44px 0;text-align:center;color:var(--ink3);font-size:13px}
@media(max-width:640px){
  .priceCell{width:88px}
  .pv{width:42px;font-size:17px}
  .det,.row.open+.det{grid-template-columns:1fr;padding-left:0}
}
</style></head><body>
<header class="mast">
  <div class="mast-in">
    <div class="wordmark">TD Board <b>· NFL anytime-TD model, 2026</b></div>
    <div class="meta" id="metaLine"></div>
  </div>
</header>
<div class="wrap">
  <nav class="tabs">
    <button class="tab on" data-tab="picks">Picks</button>

    <button class="tab" data-tab="offense">Offense</button>
    <button class="tab" data-tab="defense">Defense</button>

  <section class="view on" id="v-picks">

      <div class="seg" id="posChips">

      <div class="seg" id="rankBy">

      <button class="link" id="advBtn">Adjust</button>
      <button class="link" id="pasteBtn">Paste odds</button>

    <div class="adjust" id="advPanel">

      <div class="adj"><div class="adjtop">Yardage volume <b id="vYD">20</b></div><input type="range" id="wYD" min="0" max="100" value="20"></div>
      <div class="adj"><div class="adjtop">Team total <b id="vTT">16</b></div><input type="range" id="wTT" min="0" max="100" value="16"></div>
    </div>
    <div class="adjust" id="pastePanel">
      <div style="width:100%">
        <textarea id="pasteBox" spellcheck="false" style="width:100%;min-height:96px;resize:vertical;font-family:var(--num);font-size:12px;line-height:1.5;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink)" placeholder="Paste the touchdown scorer board from DraftKings. Copying the whole table fills anytime, first TD and 2+ TD prices at once."></textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-top:9px">
          <button class="primary" id="applyOdds">Apply</button>
          <button class="link" id="clearOdds">Clear</button>
          <span class="meta" id="pasteMsg"></span>
        </div>
      </div>
    </div>
    <div class="board" id="board"></div>
    <button class="link" id="unavailBtn" style="margin-top:14px"></button>
  </section>

  <section class="view" id="v-bets">
    <div class="bar">
      <div class="seg" id="betMarket">
        <button class="on" data-m="anytime">Anytime</button>
        <button data-m="first_td">First TD</button>
        <button data-m="two_plus">2+ TDs</button>
      </div>
      <div class="seg" id="betPos">
        <button class="on" data-pos="ALL">All</button><button data-pos="RB">RB</button>
        <button data-pos="WR">WR</button><button data-pos="TE">TE</button><button data-pos="QB">QB</button>
      </div>
      <span class="grow"></span>
      <input type="search" class="find" id="betQ" placeholder="Find a player">
    </div>
    <div class="tbl" id="betTable"></div>
  </section>

  <section class="view" id="v-slate"><div class="slate" id="slate"></div></section>

  <section class="view" id="v-offense">
    <div class="bar">
      <div class="seg" id="offPos">
        <button class="on" data-pos="ALL">Team</button><button data-pos="RB">RB</button>
        <button data-pos="WR">WR</button><button data-pos="TE">TE</button><button data-pos="QB">QB</button>
      </div>
      <div class="seg" id="offSrc">
        <button class="on" data-src="2025">2025 season</button><button data-src="pre">2026 preseason</button>
      </div>
      <span class="grow"></span>
      <button class="link" id="offPG">Per game</button>
      <input type="search" class="find" id="offQ" placeholder="Find a team">
    </div>
    <div class="tbl" id="offTable"></div>
  </section>

  <section class="view" id="v-defense">
    <div class="bar">
      <div class="seg" id="defPos">
        <button class="on" data-pos="ALL">Team</button><button data-pos="RB">RB</button>
        <button data-pos="WR">WR</button><button data-pos="TE">TE</button><button data-pos="QB">QB</button>
      </div>
      <div class="seg" id="defSrc">
        <button class="on" data-src="2025">2025 season</button><button data-src="pre">2026 preseason</button>
      </div>
      <span class="grow"></span>
      <button class="link" id="defPG">Per game</button>
      <input type="search" class="find" id="defQ" placeholder="Find a team">
    </div>
    <div class="tbl" id="defTable"></div>
  </section>

  <div class="foot" id="notes"></div>
</div>

function matchupOf(p){
  const o=p.next_opp, T=DATA.teams;
  if(!o||!T[p.team]||!T[o])return null;
  const fieldMap={RB:['ruY','ruT','rush'],WR:['reY','reT','rec'],TE:['reY','reT','rec'],QB:['paY','paT','pass']};
  const [yk,tk,label]=fieldMap[p.pos]||['reY','reT','rec'];
  const offNode=T[p.team].off, defNode=T[o].def;
  const offPos=offNode.pos[p.pos]||{}, defPos=defNode.pos[p.pos]||{};
  const offG=offNode.G||17, defG=defNode.G||17;
  const offY=(offPos[yk]||0)/offG, defY=(defPos[yk]||0)/defG;
  let soft=null;
  if(DATA.matchup[o]&&DATA.matchup[o][p.pos])soft=DATA.matchup[o][p.pos].soft_rank;
  return{mu:p.mu,label,offY,defY,opp:o,soft};
}
function scoreOf(p){
  const w=(W.wSea+W.wRZ+W.wTT+W.wYD)||1;
  const hit=(p.eff_hit!=null?p.eff_hit:p.season_hit);
  const a=Math.min(((p.eff_rz10!=null?p.eff_rz10:p.rz_pg)||0)/2.5,1);
  const b=Math.min(((p.eff_rz5!=null?p.eff_rz5:p.gl_pg)||0)/1.2,1);
  const y=Math.min(((p.eff_yds!=null?p.eff_yds:p.yds_pg)||0)/90,1);
  const itt=p.itt!=null?Math.min(Math.max((p.itt-15)/13,0),1):0.5;
  const s=(W.wSea*hit+(W.wRZ/2)*a+(W.wRZ/2)*b+W.wTT*itt+W.wYD*y)/w;
  const c=calFor(p.pos);
  return{score:Math.round(s*100),prob:sig(c.b0+c.b1*s)};
}

    const [yk,tk]=fieldMap[p.pos]||['reY','reT'];
    const offNode=T[p.team].off, defNode=T[o].def;
    const offPos=offNode.pos[p.pos]||{}, defPos=defNode.pos[p.pos]||{};
    const offG=offNode.G||17, defG=defNode.G||17;
    const offY=((offPos[yk]||0)/offG).toFixed(1), defY=((defPos[yk]||0)/defG).toFixed(1);
    let rankHTML='';
    if(o&&DATA.matchup[o]&&DATA.matchup[o][p.pos]){const md=DATA.matchup[o][p.pos];rankHTML=` — ${ord(md.soft_rank)} softest to ${p.pos} in the league`;}
    muHTML=`<div class="dk" style="margin-top:10px">2025, from the Offense / Defense tabs: <b style="color:var(--ink2)">${p.team}</b> produced ${offY} ${yk==='paY'?'pass':(p.pos==='RB'?'rush':'rec')} yds/g to ${p.pos}s · <b style="color:var(--ink2)">${o}</b> allowed ${defY}/g${rankHTML}.</div>`;

    const preOff=T[p.team].pre_off, preDef=T[o].pre_def;
    if(preOff&&preDef){
      muHTML+=`<div class="dk" style="margin-top:5px">2026 preseason (n=${preOff.G} / ${preDef.G}, mostly backups, team totals only — not split by position): <b style="color:var(--ink2)">${p.team}</b> offense ${preOff.totYpg.toFixed(0)} total yds/g · <b style="color:var(--ink2)">${o}</b> defense allowed ${preDef.totYpg.toFixed(0)}/g.</div>`;
    }
  }
  return `<div class="det">${left}<div><div class="dk">What builds the number</div>`+
    bar('Hit rate',(p.eff_hit!=null?p.eff_hit:p.season_hit),Math.round((p.eff_hit!=null?p.eff_hit:p.season_hit)*100)+'%')+
    bar('Red zone',a,((p.rz_pg||0)).toFixed(1)+'/g')+
    bar('Goal line',b,((p.gl_pg||0)).toFixed(1)+'/g')+
    bar('Team total',itt,p.itt!=null?p.itt.toFixed(1):'—')+
    `<div class="tagrow">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>${muHTML}</div></div>`;
}
function renderPicks(){
  const el=$('#board');

    if(hideUnavail&&p.rostered===false)return false;
    if(P.pos!=='ALL'&&p.pos!==P.pos)return false;
    if(P.q&&!p.name.toLowerCase().includes(P.q))return false;
    return true;}).map(p=>({p,...scoreOf(p)}));
  if(RANK.by==='matchup'){
    list=list.filter(it=>it.p.mu!=null);
    list.sort((a,b)=>(b.p.mu-a.p.mu)||b.prob-a.prob);
  } else {
    list.sort((a,b)=>b.prob-a.prob);
  }

    const p=it.p,col=p.rostered===false?'#9CA3AF':tc(p.team),fl=primaryFlag(p);

      <span class="rk">${i+1}</span>${crest(p.team,'crest')}
      <div class="who"><div class="nm">${p.name}<span class="flag ${fl&&fl.warn?'warn':''}">${fl?' · '+fl.t:''}</span>${muBadge}</div>
        <div class="sub">${p.pos} <b>${p.team}</b>${p.next_opp?' vs '+p.next_opp:''}</div></div>
      <div class="pv">${Math.round(it.prob*100)}%</div>

  el.querySelectorAll('.row').forEach(r=>r.addEventListener('click',e=>{
    if(e.target.closest('.priceCell'))return;r.classList.toggle('open');}));
  el.querySelectorAll('.odds').forEach(inp=>inp.oninput=e=>{
    const nm=e.target.dataset.nm;ODDS.anytime[nm]=e.target.value;
    const it=list.find(x=>x.p.name===nm),wrap=e.target.closest('.priceCell'),at=e.target.selectionStart;
    wrap.innerHTML=edgeHTML(it.p,it.prob);const ni=wrap.querySelector('.odds');ni.oninput=inp.oninput;ni.focus();
    try{ni.setSelectionRange(at,at);}catch(_){}renderBets();});
}

    .sort((a,b)=>b.prob-a.prob).slice(0,3);

    const fav=g.spread_home!=null?(g.spread_home<0?`${g.home} ${g.spread_home}`:`${g.away} ${-g.spread_home}`):'';

      top(t).map(it=>`<div class="pr"><span>${it.p.name}</span><span>${Math.round(it.prob*100)}%</span></div>`).join('')+`</div>`;

}
function renderBets(){
  const el=$('#betTable'),M=MKT.key;
  let rows=DATA.players.filter(p=>{
    if(p.rostered===false)return false;
    if(ODDS[M][p.name]==null||ODDS[M][p.name]===''||isNaN(+ODDS[M][p.name]))return false;
    if(BET.pos!=='ALL'&&p.pos!==BET.pos)return false;
    if(BET.q&&!p.name.toLowerCase().includes(BET.q))return false;
    return true;
  }).map(p=>{const sc=scoreOf(p);const pr=(M==='anytime')?sc.prob:probFor(p,M);const b=betOf(p,pr,M);
    return{p,price:+ODDS[M][p.name],need:b.be,model:pr*100,tru:b.tr,value:b.value,mu:b.mu,bet:b.score};});
  if(!rows.length){el.innerHTML=`<div class="empty">No ${MKTLABEL[M]} prices yet. Paste the scorer board on the Picks tab.</div>`;return;}
  rows.sort((a,b)=>BET.sort==='name'?BET.dir*a.p.name.localeCompare(b.p.name):BET.dir*(a[BET.sort]-b[BET.sort]));
  const fmt=v=>(v>=0?'+':'')+v.toFixed(1);
  el.innerHTML=`<table><thead><tr><th class="${BET.sort==='name'?'on':''}" data-k="name">Player</th>`+
    [['price','Price'],['need','Need'],['model','Model'],['value','Value'],['mu','Matchup'],['bet','Bet']]
      .map(([k,l])=>`<th class="${BET.sort===k?'on':''}" data-k="${k}">${l}</th>`).join('')+`</tr></thead><tbody>`+
    rows.map((r,i)=>{const p=r.p;
      return `<tr><td><div class="tc">${crest(p.team,'')}<div><div class="betname">${i+1}. ${p.name}</div>`+
        `<div class="betsub">${p.pos} ${p.team} vs ${p.next_opp||'—'}</div></div></div></td>`+
        `<td>${r.price>0?'+':''}${r.price}</td><td>${r.need.toFixed(1)}%</td><td>${r.model.toFixed(0)}%</td>`+
        `<td class="${r.value>0?'up':(r.value<0?'down':'')}">${fmt(r.value)}</td>`+
        `<td class="${r.mu>0?'up':(r.mu<0?'down':'')}">${fmt(r.mu)}</td>`+
        `<td class="${r.bet>0?'up':(r.bet<0?'down':'')}" style="font-weight:600">${fmt(r.bet)}</td></tr>`;}).join('')+`</tbody></table>`;
  el.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;
    if(BET.sort===k)BET.dir*=-1;else{BET.sort=k;BET.dir=(k==='name')?1:-1;}renderBets();});

const COLS=[['ruY','Rush yds'],['ruT','Rush TD'],['reY','Rec yds'],['reT','Rec TD'],['paT','Pass TD'],['aTD','Anytime TD']];
const PRECOLS=[['ruY','Rush yds'],['ruYpg','Rush yds/g'],['paY','Pass yds'],['paYpg','Pass yds/g'],['totYpg','Total yds/g'],['ptsPg','Pts/g']];
function renderTable(side){
  const st=side==='off'?OFF:DEF,el=$('#'+side+'Table');
  if(st.src==='pre'){
    const key=side==='off'?'pre_off':'pre_def';
    let rows=Object.keys(DATA.teams).filter(t=>DATA.teams[t][key]).map(t=>({team:t,...DATA.teams[t][key]}));
    if(st.q)rows=rows.filter(r=>r.team.includes(st.q));
    const sortKey=PRECOLS.some(([k])=>k===st.sort)?st.sort:'totYpg';
    rows.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return sortKey==='team'?st.dir*String(x).localeCompare(String(y)):st.dir*(x-y);});
    const mx={};PRECOLS.forEach(([k])=>mx[k]=Math.max(...rows.map(r=>r[k]),0));
    const suf=side==='def'?' allowed':'';
    el.innerHTML=`<table><thead><tr><th data-k="team">Team</th><th data-k="G">G</th>`+
      PRECOLS.map(([k,l])=>`<th class="${st.sort===k?'on':''}" data-k="${k}">${l}${suf}</th>`).join('')+
      `</tr></thead><tbody>`+rows.map(r=>`<tr><td><div class="tc">${crest(r.team,'')}<span style="color:${tc(r.team)}">${r.team}</span></div></td><td>${r.G}</td>`+
        PRECOLS.map(([k])=>`<td class="${r[k]===mx[k]&&mx[k]>0?'max':''}">${k.includes('pg')||k==='ptsPg'?r[k].toFixed(1):r[k]}</td>`).join('')+`</tr>`).join('')+`</tbody></table>`;
    el.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;
      if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=(k==='team')?1:-1;}renderTable(side);});
    return;
  }
  let rows=Object.keys(DATA.teams).map(t=>{const n=DATA.teams[t][side],src=st.pos==='ALL'?n.total:n.pos[st.pos],G=n.G||17;
    const o={team:t,G};COLS.forEach(([k])=>o[k]=st.pg?+(src[k]/G).toFixed(2):src[k]);return o;});
  if(st.q)rows=rows.filter(r=>r.team.includes(st.q));
  rows.sort((a,b)=>{const x=a[st.sort],y=b[st.sort];
    return st.sort==='team'?st.dir*String(x).localeCompare(String(y)):st.dir*(x-y);});
  const mx={};COLS.forEach(([k])=>mx[k]=Math.max(...rows.map(r=>r[k]),0));
  const suf=side==='def'?' allowed':'';
  el.innerHTML=`<table><thead><tr><th class="${st.sort==='team'?'on':''}" data-k="team">Team</th><th data-k="G">G</th>`+
    COLS.map(([k,l])=>`<th class="${st.sort===k?'on':''}" data-k="${k}">${l}${suf}</th>`).join('')+
    `</tr></thead><tbody>`+rows.map(r=>`<tr><td><div class="tc">${crest(r.team,'')}<span style="color:${tc(r.team)}">${r.team}</span></div></td><td>${r.G}</td>`+
      COLS.map(([k])=>`<td class="${r[k]===mx[k]&&mx[k]>0?'max':''}">${r[k]}</td>`).join('')+`</tr>`).join('')+`</tbody></table>`;
  el.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;
    if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=(k==='team')?1:-1;}renderTable(side);});
}

/* paste parser */
const SUFFIX=new Set(['jr','sr','ii','iii','iv','v']);
function pnorm(s){s=String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  s=s.replace(/[.'\u2019]/g,'').replace(/-/g,' ');return s.split(/\s+/).filter(w=>w&&!SUFFIX.has(w)).join(' ');}
const ptight=s=>pnorm(s).replace(/ /g,'');
function pinit(s){const p=pnorm(s).split(' ');return p.length>1?p[0][0]+' '+p[p.length-1]:pnorm(s);}
function buildIdx(players){const e={},t={},l={};const push=(m,k,p)=>{(m[k]=m[k]||[]).push(p);};
  players.forEach(p=>{push(e,pnorm(p.name),p);push(t,ptight(p.name),p);push(l,pinit(p.name),p);});return{e,t,l};}
function parseOdds(text,players){
  const idx=buildIdx(players);
  const applied={first_td:{},two_plus:{},anytime:{}},unmatched=[],ambiguous=[];
  const priceRe=/^[+\u2212-]\d{2,4}$/;
  const lines=String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const pairs=[];let pending=null,bucket=[];
  const flush=()=>{if(pending&&bucket.length)pairs.push([pending,bucket.slice()]);pending=null;bucket=[];};
  lines.forEach(line=>{
    const clean=line.replace(/\u2212/g,'-');
    const inline=clean.match(/^(.*?[A-Za-z].*?)[\s\t|,]+([+-]\d{2,4})\s*$/);
    if(inline){flush();pairs.push([inline[1],[inline[2]]]);return;}
    if(priceRe.test(clean)){if(pending)bucket.push(clean.replace('\u2212','-'));return;}
    if(/[A-Za-z]{2,}/.test(clean)){flush();pending=clean;}
  });
  flush();
  const ORDER=['anytime','first_td','two_plus'];
  pairs.forEach(([rawName,prices])=>{
    let nm=rawName.replace(/\b(anytime|atd|td|scorer|yes|no|first|2\+|tds)\b/gi,'')
                  .replace(/\([^)]*\)/g,'').replace(/[|,]/g,' ').replace(/\s{2,}/g,' ').trim();
    const teamHit=nm.match(/\b([A-Z]{2,3})\b\s*$/);let team=null;
    if(teamHit&&teamHit[1]!==nm.trim()){team=teamHit[1];nm=nm.slice(0,teamHit.index).trim();}
    if(nm.length<3)return;
    let hit=null;
    for(const [map,key] of [[idx.e,pnorm(nm)],[idx.t,ptight(nm)],[idx.l,pinit(nm)]]){
      let cands=map[key]||[];
      if(team&&cands.filter(p=>p.team===team).length)cands=cands.filter(p=>p.team===team);
      if(cands.length===1){hit=cands[0];break;}
      if(cands.length>1){ambiguous.push(nm);return;}
    }
    if(!hit){unmatched.push(nm);return;}
    prices.slice(0,3).forEach((raw,i)=>{const v=parseInt(raw,10);applied[ORDER[i]][hit.name]=(v>0?'+':'')+v;});
  });
  return{applied,unmatched,ambiguous,found:pairs.length};
}
